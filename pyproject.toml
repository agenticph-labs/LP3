[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rfp-analyzer"
version = "0.1.0"
description = "RFP/RFQ Analyzer — structured extraction from procurement documents"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "streamlit>=1.35",
    "openai>=1.40",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.3",
    "bandit>=1.7",
]

[project.scripts]
rfp-analyzer = "src.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

exclude = ["sample_docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.bandit]
exclude_dirs = ["tests", "sample_docs"]
